<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- IMPORTANT FOR MOBILE -->
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WorkAxis Dashboard</title>

  <style>

    /* ========================================
       RESET
    ======================================== */

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0 !important;
      padding: 0 !important;

      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;

      overflow-x: hidden !important;

      background: transparent;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }


    /* ========================================
       MAIN CONTAINER
    ======================================== */

    .dashboard-container {

      /*
        IMPORTANT:
        Slightly smaller than Jotform iframe.

        This prevents the right side from
        being cut off on mobile.
      */

      width: calc(100% - 20px) !important;
      max-width: calc(100% - 20px) !important;

      min-width: 0 !important;

      margin-left: auto !important;
      margin-right: auto !important;

      padding: 0 !important;

      overflow-x: hidden !important;
    }


    /* ========================================
       DASHBOARD CARDS
    ======================================== */

    .dashboard-card {

      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;

      margin: 0 0 12px 0 !important;

      padding: 20px !important;

      background: #0b1c2e;

      border-radius: 14px;

      overflow: hidden !important;

      box-sizing: border-box !important;
    }


    /* ========================================
       CARD TITLE
    ======================================== */

    .card-title {

      margin: 0 0 14px 0;

      color: #91a7c7;

      font-size: 12px;

      font-weight: 700;

      letter-spacing: 1.5px;

      line-height: 1.3;

      text-transform: uppercase;

      overflow-wrap: anywhere;
    }


    /* ========================================
       MONEY
    ======================================== */

    .card-amount {

      margin: 0;

      color: #ffffff;

      font-size: 38px;

      font-weight: 700;

      line-height: 1.1;

      overflow-wrap: anywhere;
    }


    /* ========================================
       GREEN STATUS
    ======================================== */

    .card-status {

      margin-top: 14px;

      color: #00d7b5;

      font-size: 14px;

      font-weight: 600;

      line-height: 1.4;

      overflow-wrap: anywhere;
    }


    /* ========================================
       DESCRIPTION
    ======================================== */

    .card-description {

      margin-top: 12px;

      color: #8398b7;

      font-size: 14px;

      line-height: 1.5;

      overflow-wrap: anywhere;
    }


    /* ========================================
       REFERRAL CODE
    ======================================== */

    .referral-code {

      display: inline-block;

      max-width: 100%;

      margin-top: 14px;

      padding: 8px 12px;

      background: rgba(255,255,255,0.08);

      border-radius: 8px;

      color: #ffffff;

      font-size: 15px;

      font-weight: 700;

      letter-spacing: 1px;

      overflow-wrap: anywhere;
    }



    /* ========================================
       TABLET
    ======================================== */

    @media screen and (max-width: 768px) {

      .dashboard-container {

        width: calc(100% - 20px) !important;

        max-width: calc(100% - 20px) !important;

      }


      .dashboard-card {

        padding: 18px !important;

        border-radius: 12px;

      }


      .card-amount {

        font-size: 34px;

      }

    }



    /* ========================================
       MOBILE
    ======================================== */

    @media screen and (max-width: 600px) {

      html,
      body {

        width: 100% !important;

        max-width: 100% !important;

        min-width: 0 !important;

        margin: 0 !important;

        padding: 0 !important;

        overflow-x: hidden !important;

      }


      .dashboard-container {

        /*
          24px smaller than iframe.
          Gives roughly 12px space
          on left and right.
        */

        width: calc(100% - 24px) !important;

        max-width: calc(100% - 24px) !important;

        min-width: 0 !important;

        margin-left: auto !important;

        margin-right: auto !important;

        padding: 0 !important;

      }


      .dashboard-card {

        width: 100% !important;

        max-width: 100% !important;

        min-width: 0 !important;

        margin-left: 0 !important;

        margin-right: 0 !important;

        margin-bottom: 10px !important;

        padding: 16px !important;

        border-radius: 11px;

      }


      .card-title {

        font-size: 10px;

        letter-spacing: 1.3px;

        margin-bottom: 11px;

      }


      .card-amount {

        font-size: 30px;

      }


      .card-status {

        margin-top: 11px;

        font-size: 12px;

      }


      .card-description {

        margin-top: 10px;

        font-size: 12px;

        line-height: 1.45;

      }


      .referral-code {

        font-size: 13px;

        padding: 7px 10px;

      }

    }



    /* ========================================
       SMALL MOBILE
    ======================================== */

    @media screen and (max-width: 400px) {

      .dashboard-container {

        width: calc(100% - 20px) !important;

        max-width: calc(100% - 20px) !important;

      }


      .dashboard-card {

        padding: 14px !important;

      }


      .card-amount {

        font-size: 27px;

      }


      .card-title {

        font-size: 9px;

      }


      .card-status,
      .card-description {

        font-size: 11px;

      }

    }



    /* ========================================
       VERY SMALL MOBILE
    ======================================== */

    @media screen and (max-width: 320px) {

      .dashboard-container {

        width: calc(100% - 16px) !important;

        max-width: calc(100% - 16px) !important;

      }


      .dashboard-card {

        padding: 12px !important;

      }


      .card-amount {

        font-size: 24px;

      }

    }

  </style>

</head>


<body>


  <div class="dashboard-container">


    <!-- ==========================
         AVAILABLE BALANCE
    =========================== -->

    <div class="dashboard-card">

      <div class="card-title">
        Available Balance 2026
      </div>

      <div class="card-amount">
        $1,250.00
      </div>

      <div class="card-status">
        ↗ Ready to withdraw
      </div>

    </div>



    <!-- ==========================
         PENDING INCOME
    =========================== -->

    <div class="dashboard-card">

      <div class="card-title">
        Pending Income
      </div>

      <div class="card-amount">
        $0.00
      </div>

      <div class="card-description">
        0 active tasks in pipeline
      </div>

    </div>



    <!-- ==========================
         INCOME THIS MONTH
    =========================== -->

    <div class="dashboard-card">

      <div class="card-title">
        Income This Month
      </div>

      <div class="card-amount">
        $760.00
      </div>

      <div class="card-description">
        Completed tasks only
      </div>

    </div>



    <!-- ==========================
         REFERRAL
    =========================== -->

    <div class="dashboard-card">

      <div class="card-title">
        Referral Code
      </div>

      <div class="card-description">
        Share your code to invite new members.
        Earn bonuses when they complete their first task.
      </div>

      <div class="referral-code">
        WORKAXIS1250
      </div>

    </div>


  </div>


</body>

</html>
