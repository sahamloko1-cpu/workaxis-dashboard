<!DOCTYPE html>
<html lang="en">
<head>
  <!-- <meta charset="UTF-8"> -->
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1"> -->

  <title>WorkAxis Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    .dashboard {
      width: 100%;
      max-width: 100%;
      padding: 0;
      margin: 0;
    }

    .card {
      width: 100%;
      max-width: 100%;
      margin: 0 0 18px 0;

      padding: 24px 22px;

      background: #0d182b;
      border: 1px solid #263a57;
      border-radius: 18px;

      color: white;
      overflow: hidden;
    }

    .label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.3px;
      color: #7185a5;
      text-transform: uppercase;
      line-height: 1.3;
    }

    .amount {
      margin-top: 18px;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 700;
      line-height: 1.1;
      color: #f5f7ff;
      white-space: nowrap;
    }

    .status {
      margin-top: 12px;
      font-size: 16px;
      color: #00d7ae;
      line-height: 1.4;
    }

    .description {
      margin-top: 12px;
      font-size: 15px;
      color: #7185a5;
      line-height: 1.4;
    }

    @media (max-width: 420px) {
      .card {
        padding: 20px 18px;
      }

      .amount {
        font-size: 32px;
      }

      .status,
      .description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard">

    <div class="card">
      <div class="label">Available Balance</div>
      <div class="amount">$1,250.00</div>
      <div class="status">↗ Ready to withdraw</div>
    </div>

    <div class="card">
      <div class="label">Pending Income</div>
      <div class="amount">$0.00</div>
      <div class="description">0 active tasks in pipeline</div>
    </div>

    <div class="card">
      <div class="label">Income This Month</div>
      <div class="amount">$760.00</div>
      <div class="description">Completed tasks only</div>
    </div>

    <div class="card">
      <div class="label">Referral Code</div>
      <div class="description">
        Share your code to invite new members.<br>
        Earn bonuses when they complete their first task.
      </div>
    </div>

  </div>

</body>
</html>
