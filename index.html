<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- VERY IMPORTANT FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
body {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;
    margin: 0 !important;
    padding: 0 !important;
    overflow-x: hidden !important;
    box-sizing: border-box !important;
}

.dashboard-container {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;

    margin: 0 !important;
    padding: 0 !important;

    box-sizing: border-box !important;
    overflow-x: hidden !important;
}

.dashboard-card {
    width: 100% !important;
    max-width: 100% !important;
    min-width: 0 !important;

    margin-left: 0 !important;
    margin-right: 0 !important;
    margin-bottom: 12px !important;

    padding: 16px !important;

    box-sizing: border-box !important;
    overflow: hidden !important;
}


/* PHONE */
@media screen and (max-width: 600px) {

    .dashboard-container {
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
    }

    .dashboard-card {
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;

        padding: 14px !important;
        margin: 0 0 10px 0 !important;

        box-sizing: border-box !important;
    }
}

    
  </style>
</head>

<body>

  <div class="dashboard-container">

    <div class="dashboard-card">
      <div class="card-title">Available Balance1</div>

      <div class="card-amount">
        $1,250.00
      </div>

      <div class="withdraw">
        ↗ Ready to withdraw
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">Pending Income</div>

      <div class="card-amount">
        $0.00
      </div>

      <div class="card-description">
        0 active tasks in pipeline
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">Income This Month</div>

      <div class="card-amount">
        $760.00
      </div>

      <div class="card-description">
        Completed tasks only
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">
        Referral Code
      </div>

      <div class="card-description">
        Share your code to invite new members.
        Earn bonuses when they complete their first task.
      </div>
    </div>

  </div>

</body>
</html>
