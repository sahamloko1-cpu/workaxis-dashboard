<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- VERY IMPORTANT FOR MOBILE -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      background: transparent;
    }

    /* Main wrapper */
    .dashboard-container {
      width: 100%;
      max-width: 100%;
      padding: 10px;
      margin: 0 auto;
    }

    /* Each dashboard card */
    .dashboard-card {
      width: 100%;
      max-width: 100%;
      min-width: 0;

      background: #0d1b2f;
      border-radius: 14px;

      padding: 22px;
      margin-bottom: 14px;

      overflow: hidden;
    }

    .card-title {
      margin: 0 0 15px;
      color: #8fa5c6;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;

      overflow-wrap: anywhere;
    }

    .card-amount {
      margin: 0;
      color: white;
      font-size: clamp(28px, 8vw, 40px);
      font-weight: 700;
      line-height: 1.1;

      overflow-wrap: anywhere;
    }

    .card-description {
      margin-top: 12px;
      color: #8397b5;
      font-size: 14px;
      line-height: 1.5;

      overflow-wrap: anywhere;
    }

    .withdraw {
      margin-top: 12px;
      color: #00d6b4;
      font-size: 14px;
      font-weight: 600;
    }

    /* Mobile */
    @media screen and (max-width: 600px) {

      .dashboard-container {
        padding: 6px;
      }

      .dashboard-card {
        width: 100%;
        padding: 16px;
        margin-bottom: 10px;
        border-radius: 12px;
      }

      .card-title {
        font-size: 10px;
        letter-spacing: 1.2px;
      }

      .card-amount {
        font-size: 30px;
      }

      .card-description,
      .withdraw {
        font-size: 12px;
      }
    }

    /* Very small phones */
    @media screen and (max-width: 360px) {

      .dashboard-card {
        padding: 13px;
      }

      .card-amount {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="dashboard-container">

    <div class="dashboard-card">
      <div class="card-title">Available Balance</div>

      <div class="card-amount">
        $1,250.00
      </div>

      <div class="withdraw">
        ↗ Ready to withdraw
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">Pending Income</div>

      <div class="card-amount">
        $0.00
      </div>

      <div class="card-description">
        0 active tasks in pipeline
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">Income This Month</div>

      <div class="card-amount">
        $760.00
      </div>

      <div class="card-description">
        Completed tasks only
      </div>
    </div>


    <div class="dashboard-card">
      <div class="card-title">
        Referral Code
      </div>

      <div class="card-description">
        Share your code to invite new members.
        Earn bonuses when they complete their first task.
      </div>
    </div>

  </div>

</body>
</html>
