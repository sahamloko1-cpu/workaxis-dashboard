<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>WorkAxis Dashboard</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;

    width: 100%;
    max-width: 100%;

    overflow-x: hidden;

    background: transparent;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}


/* MAIN AREA */

.dashboard {
    width: 90%;
    max-width: 320px;

    margin: 0 auto;
    padding: 8px 0 20px 0;
}


/* CARD */

.card {
    display: block;

    width: 100%;
    max-width: 100%;

    margin: 0 0 18px 0;
    padding: 24px 22px;

    background: #0d182b;

    border: 1px solid #263a57;
    border-radius: 18px;

    overflow: hidden;
}


/* LABEL */

.label {
    margin: 0;

    color: #8396b7;

    font-size: 13px;
    font-weight: 700;

    letter-spacing: 1.4px;
    line-height: 1.4;

    text-transform: uppercase;

    overflow-wrap: anywhere;
}


/* LARGE AMOUNT */

.amount {
    margin-top: 18px;

    color: #f5f7ff;

    font-size: clamp(30px, 8vw, 40px);
    font-weight: 700;

    line-height: 1.15;

    overflow-wrap: anywhere;
}


/* GREEN STATUS */

.status {
    margin-top: 13px;

    color: #00d7ae;

    font-size: 16px;
    font-weight: 500;

    line-height: 1.4;

    overflow-wrap: anywhere;
}


/* NORMAL DESCRIPTION */

.description {
    margin-top: 12px;

    color: #8396b7;

    font-size: 15px;

    line-height: 1.5;

    white-space: normal;

    overflow-wrap: anywhere;
    word-break: normal;
}


/* SMALLER PHONES */

@media screen and (max-width: 430px) {

    .dashboard {
        width: 50%;
    }

    .card {
        padding: 21px 18px;
        border-radius: 16px;
    }

    .amount {
        font-size: 32px;
    }

    .status {
        font-size: 15px;
    }

    .description {
        font-size: 14px;
    }
}


/* VERY SMALL PHONES */

@media screen and (max-width: 350px) {

    .dashboard {
        width: 50%;
    }

    .amount {
        font-size: 28px;
    }

}

</style>
</head>

<body>

<div class="dashboard">


    <!-- AVAILABLE BALANCE -->

    <div class="card">

        <div class="label">
            Available Balance11
        </div>

        <div class="amount">
            $1,250.00
        </div>

        <div class="status">
            ↗ Ready to withdraw
        </div>

    </div>



    <!-- PENDING INCOME -->

    <div class="card">

        <div class="label">
            Pending Income
        </div>

        <div class="amount">
            $0.00
        </div>

        <div class="description">
            0 active tasks in pipeline
        </div>

    </div>



    <!-- MONTHLY INCOME -->

    <div class="card">

        <div class="label">
            Income This Month
        </div>

        <div class="amount">
            $760.00
        </div>

        <div class="description">
            Completed tasks only
        </div>

    </div>



    <!-- REFERRAL -->

    <div class="card">

        <div class="label">
            Referral Code
        </div>

        <div class="description">
            Share your code to invite new members.
            Earn bonuses when they complete their first task.
        </div>

    </div>


</div>

</body>
</html>
